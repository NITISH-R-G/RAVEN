name: AI Release Summarizer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Get Recent Commits
      run: |
        # Get commits since previous tag or all if no previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -z "$PREV_TAG" ]; then
          git log --pretty=format:"%h - %s" > recent_commits.txt
        else
          git log $PREV_TAG..HEAD --pretty=format:"%h - %s" > recent_commits.txt
        fi

    - name: Run AI Release Summary
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        COMMITS_PATH: recent_commits.txt
      run: node scripts/automation/release-summary.js

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: release-notes.md
        files: |
          docs/architecture/repo-architecture.json
          docs/architecture/*.svg
